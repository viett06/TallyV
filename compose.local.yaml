# Local API (e.g. PyCharm/uvicorn) with a Docker worker.
# Keep application code and stored attachments shared with the host API.
# docker compose -f compose.yaml -f compose.outlook.yaml -f compose.local.yaml up -d --no-deps worker
services:
  worker:
    volumes:
      - ./app:/app/app:ro
      - ./data:/app/data
