services:
  minio:
    restart: unless-stopped
    image: tallyv-minio:RELEASE.2025-10-15T17-29-55Z
    build: ./infra/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run python -m scripts.configure_storage first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run python -m scripts.configure_storage first}
      MINIO_BROWSER: "on"
      MINIO_UPDATE: "off"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["object_data:/data"]
    networks: [internal, access]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
  minio-init:
    image: tallyv-minio:RELEASE.2025-10-15T17-29-55Z
    entrypoint: ["sh", "/usr/local/bin/init-storage"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-tallyv-files}
      S3_PREFIX: ${S3_PREFIX:-tallyv/}
    depends_on:
      minio: {condition: service_healthy}
    networks: [internal]
  db:
    restart: unless-stopped
    image: tallyv-postgres-vector:16
    build: ./infra/postgres
    environment:
      POSTGRES_USER: tallyv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
      POSTGRES_DB: tallyv
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallyv -d tallyv"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [internal, access]
  api:
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tallyv:${POSTGRES_PASSWORD}@db:5432/tallyv
      STORAGE_DIR: /app/data
      S3_ENDPOINT_URL: "${S3_DOCKER_ENDPOINT_URL-http://minio:9000}"
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
      OCR_ENABLED: "${OCR_ENABLED:-true}"
      OCR_API_URL: "${OCR_DOCKER_API_URL:-http://host.docker.internal:8001}"
      HR_MOCK_URL: http://hr-mock:8010
      ASSISTANT_OLLAMA_URL: "${ASSISTANT_DOCKER_OLLAMA_URL:-http://host.docker.internal:11435}"
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed_catalog && uvicorn main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    depends_on:
      db: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    ports: ["127.0.0.1:${TALLYV_API_HOST_PORT:-8000}:8000"]
    volumes: ["file_data:/app/data"]
    networks: [internal, access]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tallyv:${POSTGRES_PASSWORD}@db:5432/tallyv
      STORAGE_DIR: /app/data
      S3_ENDPOINT_URL: "${S3_DOCKER_ENDPOINT_URL-http://minio:9000}"
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
      OCR_ENABLED: "${OCR_ENABLED:-true}"
      OCR_API_URL: "${OCR_DOCKER_API_URL:-http://host.docker.internal:8001}"
      HR_MOCK_URL: http://hr-mock:8010
      ASSISTANT_OLLAMA_URL: "${ASSISTANT_DOCKER_OLLAMA_URL:-http://host.docker.internal:11435}"
    command: ["python", "-m", "app.worker"]
    depends_on:
      api: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    volumes: ["file_data:/app/data"]
    networks: [internal]
  hr-mock:
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tallyv:${POSTGRES_PASSWORD}@db:5432/tallyv
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
    command: ["uvicorn", "hr_mock_app:app", "--host", "0.0.0.0", "--port", "8010", "--no-access-log"]
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8010:8010"]
    networks: [internal, access]
  ollama:
    image: ollama/ollama:0.13.5
    profiles: [llm]
    volumes: ["ollama_data:/root/.ollama"]
    networks: [internal]
networks:
  access: {}
  internal:
    internal: true
volumes:
  postgres_data:
  file_data:
  ollama_data:
  object_data:
