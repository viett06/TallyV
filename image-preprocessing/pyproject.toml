[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tallyv-image-preprocessing"
version = "0.1.0"
description = "Offline, model-free PII masking for known device image layouts"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11,<13",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
image-privacy-profile = "tallyv_image_preprocessing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
