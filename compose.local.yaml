# Local API (e.g. PyCharm/uvicorn) with a Docker worker.
# Share source and legacy/demo data; new attachments use the shared MinIO bucket.
# docker compose -f compose.yaml -f compose.outlook.yaml -f compose.local.yaml up -d --no-deps ocr worker
services:
  ocr:
    ports: ["127.0.0.1:8001:8001"]
    networks: [internal, access]
  worker:
    volumes:
      - ./app:/app/app:ro
      - ./data:/app/data
